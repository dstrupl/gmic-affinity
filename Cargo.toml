[package]
name        = "gmic-affinity"
version     = "0.2.0"
edition     = "2021"
authors     = ["dstrupl"]
description = "Photoshop-compatible filter plugin for Affinity Photo on macOS that bridges G'MIC."
license     = "MIT"
repository  = "https://github.com/dstrupl/gmic-affinity"
readme      = "README.md"

[lib]
name       = "GmicFilter"
# staticlib for the .plugin bundle's loadable executable: we relink the
# resulting libGmicFilter.a with `clang -bundle` in the Makefile to produce
# an MH_BUNDLE Mach-O (filetype 8). Cargo's `cdylib` would invoke the
# linker with `-dynamiclib` and produce MH_DYLIB (filetype 6), which
# Affinity Photo 2 (and other Photoshop-plugin hosts) silently reject when
# loading a `.plugin` bundle via CFBundleLoadExecutable / dlopen.
# `rlib` is kept so the same crate can still be linked into integration
# tests under `tests/`.
crate-type = ["staticlib", "rlib"]

[features]
# Default: the no-op M1 PluginMain. Safe to install in Affinity even if the
# FilterRecord layout has not been reconciled against PIFilter.h, because the
# entry point never dereferences the struct.
default = []
# `live`: the real M3/M4 PluginMain that dereferences FilterRecord, writes
# TIFFs, and shells out to gmic. Do NOT install a live bundle in Affinity
# until `cargo test -- --ignored` passes (i.e. struct offsets match the SDK).
live = []

[dependencies]
libc     = "0.2"
tiff     = "0.9"
tempfile = "3"
objc2            = "0.5"
objc2-foundation = { version = "0.2", features = ["NSGeometry", "NSNotification", "NSObject", "NSRunLoop", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.2", features = ["NSAlert", "NSApplication", "NSBox", "NSButton", "NSButtonCell", "NSCell", "NSClipView", "NSColor", "NSColorWell", "NSControl", "NSEvent", "NSGraphics", "NSImage", "NSImageView", "NSMenu", "NSMenuItem", "NSOutlineView", "NSPanel", "NSPopUpButton", "NSResponder", "NSRunningApplication", "NSScrollView", "NSSearchField", "NSSlider", "NSSplitView", "NSTableColumn", "NSTableHeaderView", "NSTableView", "NSTextField", "NSUserInterfaceItemIdentification", "NSView", "NSWindow", "NSWorkspace"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
flate2           = { version = "1", default-features = false, features = ["rust_backend"] }
image    = { version = "0.25", default-features = false, features = ["png", "tiff"] }
sha2     = "0.10"

# `examples/picker.rs` builds against the live AppKit picker and only
# makes sense with `--features live`. Declaring `required-features`
# here means `cargo build` / `cargo build --examples` (without `live`)
# silently skip it instead of failing with a cfg-stripped empty
# `main`, which matches what cargo expects of a stand-alone example.
[[example]]
name              = "picker"
required-features = ["live"]

[[bin]]
name = "gen-previews"
path = "src/bin/gen-previews.rs"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
