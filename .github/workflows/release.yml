# Pre-release-tag pipeline. Triggered by pushing a hyphenated `v*-*`
# tag (e.g. `v0.2.0-rc.1`, `v0.2.0-beta.2`). Builds the universal
# `FEATURES=live` zip via `make release-unsigned` and publishes it as
# a GitHub Release asset, marked as a prerelease.
#
# Stable releases (vX.Y.Z without a hyphen) are NOT handled here. They
# go through `make release` on the signing collaborator's machine,
# which produces a Developer ID-signed + notarised + stapled bundle,
# creates the GitHub release, and bumps the homebrew tap cask. CI
# can't do that step because the Developer ID Application certificate
# and notarytool keychain profile only live on the signer's machine
# (see release/notarisation/SIGNING.md).
#
# Why this split:
#   - pre-release artefacts are for testing only and don't need
#     notarisation; users who download them have explicitly opted in
#     to running an ad-hoc-signed bundle and will use install.command
#     (which strips the quarantine xattr) or `make universal-install`
#     locally.
#   - stable releases must be notarised because (a) Homebrew ends
#     support for non-Gatekeeper-passing casks on 2026-09-01 and
#     (b) ad-hoc-signed bundles fail to load in Affinity Photo when
#     the quarantine xattr is set (see Phase 0 §3 in the design doc).
#
# Design rationale: docs/design/2026-05-18-release-v0.1-distribution.md
# §2 + §12. Operator-side: IMPLEMENTATION_NOTES.md §11.

name: release

on:
  push:
    tags:
      # Pre-release tags only: must contain a hyphen.
      # `v0.2.0-rc.1` matches; `v0.2.0` does not.
      - "v*-*"

# We need write access to create the GitHub Release and upload assets.
# Nothing else.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build + publish zip
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The bundled gmic catalogue snapshot lives in Git LFS; without
          # `lfs: true` the Makefile's check-lfs guard (Makefile:158)
          # fails fast because the working tree only holds the LFS
          # pointer text instead of the gzip stream.
          lfs: true
          # Tag builds don't need credentials persisted past checkout.
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Release builds are cold-ish (different feature set, profile=
          # release) and run rarely, but a cache hit still saves ~3-4
          # min on a tag rebuild.
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build release zip
        # `make release-unsigned` enforces FEATURES=live (target-scoped),
        # runs the universal build, runs `verify-bundle` (filetype 8 on
        # both slices), and assembles dist/GmicFilter-<tag>.zip with
        # only the ad-hoc signature `make universal` already laid down.
        # Stable tags don't reach this workflow (see `on.push.tags`),
        # so we never need Developer ID material here.
        run: make release-unsigned RELEASE_VERSION=${{ github.ref_name }}

      - name: Show artifact metadata
        run: |
          ls -la dist/
          shasum -a 256 dist/GmicFilter-${{ github.ref_name }}.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GmicFilter-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          # The trigger filter (`v*-*`) only admits pre-release tags
          # in the first place, so this is always true here. Kept
          # explicit (rather than hardcoded `true`) so the intent is
          # obvious to anyone reading the workflow in isolation.
          prerelease: ${{ contains(github.ref_name, '-') }}
