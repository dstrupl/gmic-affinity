name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege defaults; no token is needed beyond reading the source.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo fmt / clippy / test
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain components
        run: |
          rustup component add rustfmt clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test (default features)
        run: cargo test --locked

      - name: cargo test (--features live)
        run: cargo test --locked --features live

      - name: cargo build (universal, both targets)
        run: |
          cargo build --release --target aarch64-apple-darwin --locked
          cargo build --release --target x86_64-apple-darwin --locked
          # No Affinity host in CI -> we don't 'make install', just verify
          # both architectures build cleanly.
