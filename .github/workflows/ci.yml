name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege defaults; no token is needed beyond reading the source.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo fmt / clippy / test
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The bundled catalogue snapshot (assets/gmic-catalogue.gmic.gz)
          # is stored in Git LFS. Without lfs: true the working tree
          # holds the LFS pointer text instead of the gzip stream;
          # `include_bytes!` would then compile a fake "catalogue" that
          # parses to zero filters, and the picker would be empty in
          # the CI-built bundle. The Makefile's check-lfs guard would
          # also trip and fail loudly here, but it's nicer to just
          # hydrate the file up front.
          lfs: true

      - name: Toolchain components
        run: |
          rustup component add rustfmt clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test (default features)
        run: cargo test --locked

      - name: cargo test (--features live)
        run: cargo test --locked --features live

      - name: make universal (default features)
        # Builds both architectures AND runs `clang -bundle` + the
        # `verify-bundle` gate, so a regression that turns the output back
        # into MH_DYLIB (filetype 6) -- which Affinity / Photoshop hosts
        # silently reject -- fails the build instead of shipping silently.
        run: make universal

      - name: make universal (--features live)
        run: make universal FEATURES=live
